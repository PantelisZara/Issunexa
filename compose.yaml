name: issunexa

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${ISSUNEXA_POSTGRES_DB:-issunexa}
      POSTGRES_USER: ${ISSUNEXA_POSTGRES_USER:-issunexa}
      POSTGRES_PASSWORD: ${ISSUNEXA_POSTGRES_PASSWORD:?Set ISSUNEXA_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ISSUNEXA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  database-bootstrap:
    image: postgres:18.6
    entrypoint: ["/bin/sh", "/backend/database/bootstrap.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${ISSUNEXA_POSTGRES_DB:-issunexa}
      PGUSER: ${ISSUNEXA_POSTGRES_USER:-issunexa}
      PGPASSWORD: ${ISSUNEXA_POSTGRES_PASSWORD:?Set ISSUNEXA_POSTGRES_PASSWORD in .env}
      ISSUNEXA_FLYWAY_USERNAME: ${ISSUNEXA_FLYWAY_USERNAME:-issunexa_migrator}
      ISSUNEXA_FLYWAY_PASSWORD: ${ISSUNEXA_FLYWAY_PASSWORD:?Set ISSUNEXA_FLYWAY_PASSWORD in .env}
      ISSUNEXA_DB_USERNAME: ${ISSUNEXA_DB_USERNAME:-issunexa_runtime}
      ISSUNEXA_DB_PASSWORD: ${ISSUNEXA_DB_PASSWORD:?Set ISSUNEXA_DB_PASSWORD in .env}
    volumes:
      - ./backend/database:/backend/database:ro
      - ./backend/src/main/resources/db/migration/afterMigrate__runtime_privileges.sql:/backend/src/main/resources/db/migration/afterMigrate__runtime_privileges.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      # Only this service's TCP addresses may supply Nginx's overwritten X-Real-IP.
      ISSUNEXA_LOGIN_TRUSTED_PROXY: frontend
      ISSUNEXA_LOGIN_ACCOUNT_LIMIT: ${ISSUNEXA_LOGIN_ACCOUNT_LIMIT:-5}
      ISSUNEXA_LOGIN_ACCOUNT_WINDOW: ${ISSUNEXA_LOGIN_ACCOUNT_WINDOW:-5m}
      ISSUNEXA_LOGIN_SOURCE_LIMIT: ${ISSUNEXA_LOGIN_SOURCE_LIMIT:-30}
      ISSUNEXA_LOGIN_SOURCE_WINDOW: ${ISSUNEXA_LOGIN_SOURCE_WINDOW:-1m}
      ISSUNEXA_LOGIN_MAX_ACCOUNT_ENTRIES: ${ISSUNEXA_LOGIN_MAX_ACCOUNT_ENTRIES:-2048}
      ISSUNEXA_LOGIN_MAX_SOURCE_ENTRIES: ${ISSUNEXA_LOGIN_MAX_SOURCE_ENTRIES:-512}
      ISSUNEXA_DB_URL: jdbc:postgresql://postgres:5432/${ISSUNEXA_POSTGRES_DB:-issunexa}
      ISSUNEXA_DB_USERNAME: ${ISSUNEXA_DB_USERNAME:-issunexa_runtime}
      ISSUNEXA_DB_PASSWORD: ${ISSUNEXA_DB_PASSWORD:?Set ISSUNEXA_DB_PASSWORD in .env}
      ISSUNEXA_FLYWAY_USERNAME: ${ISSUNEXA_FLYWAY_USERNAME:-issunexa_migrator}
      ISSUNEXA_FLYWAY_PASSWORD: ${ISSUNEXA_FLYWAY_PASSWORD:?Set ISSUNEXA_FLYWAY_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ISSUNEXA_BACKEND_PORT:-8080}:8080"
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "${ISSUNEXA_FRONTEND_BIND_ADDRESS:-127.0.0.1}:${ISSUNEXA_FRONTEND_PORT:-3000}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Frontend health checks static serving only. API readiness is independent;
    # Nginx resolves backend through Docker DNS when each API request arrives.

volumes:
  postgres_data:
