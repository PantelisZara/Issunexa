name: issunexa

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${ISSUNEXA_POSTGRES_DB:-issunexa}
      POSTGRES_USER: ${ISSUNEXA_POSTGRES_USER:-issunexa}
      POSTGRES_PASSWORD: ${ISSUNEXA_POSTGRES_PASSWORD:?Set ISSUNEXA_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ISSUNEXA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      ISSUNEXA_DB_URL: jdbc:postgresql://postgres:5432/${ISSUNEXA_POSTGRES_DB:-issunexa}
      ISSUNEXA_DB_USERNAME: ${ISSUNEXA_POSTGRES_USER:-issunexa}
      ISSUNEXA_DB_PASSWORD: ${ISSUNEXA_POSTGRES_PASSWORD:?Set ISSUNEXA_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ISSUNEXA_BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${ISSUNEXA_FRONTEND_BIND_ADDRESS:-127.0.0.1}:${ISSUNEXA_FRONTEND_PORT:-3000}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Frontend health checks static serving only. API readiness is independent;
    # Nginx resolves backend through Docker DNS when each API request arrives.

volumes:
  postgres_data:
