worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # Writable paths for the non-root runtime and read-only container filesystem.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $uri $static_cache_control {
        default "no-cache";
        ~^/api/ "";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control $static_cache_control;

        location ^~ /api/ {
            # Docker's embedded DNS; resolve at request time so backend startup
            # and container replacement do not require restarting Nginx.
            resolver 127.0.0.11 valid=5s ipv6=off;
            set $backend backend:8080;
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # Replace client-supplied forwarding chains. Backend login throttling
            # uses X-Real-IP only when the TCP peer is the configured frontend.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
        }

        location ^~ /assets/ {
            try_files $uri =404;
        }

        location ^~ /branding/ {
            try_files $uri =404;
        }

        location = /index.html {
            try_files $uri =404;
        }

        # Missing files must not become a successful HTML response.
        location ~* \.(?:js|css|map|json|webmanifest|svg|png|jpe?g|gif|ico|webp|avif|woff2?|ttf|txt|xml)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
